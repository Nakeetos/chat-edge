<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Cheetos Gang</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0e;--panel:#14141b;--steel:#62626c;--red:#c4121c;--red2:#ff2a1f;--bone:#f1eedf;--gold:#ffd24a;--mute:#b5b7c4;--fs:34px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--bone);font-family:'Inter',sans-serif;overflow:hidden}
#app{height:100vh;display:flex;background:radial-gradient(ellipse at 30% 0%,#2c0a10 0%,#0f0a0d 55%,#0a0a0e 100%);border:2px solid var(--steel);position:relative}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#fx i{position:absolute;bottom:-12px;width:6px;height:6px;border-radius:50%;background:var(--red2);box-shadow:0 0 10px 2px rgba(255,42,31,.7);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.8}100%{transform:translateY(-110vh) translateX(40px);opacity:0}}
#chat{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#bar{display:flex;align-items:center;gap:18px;padding:10px 24px;border-bottom:2px solid var(--red);background:rgba(13,13,18,.9)}
#bar h1{margin:0;font-family:'Cinzel',serif;font-weight:800;font-size:calc(var(--fs)*.8);letter-spacing:4px}
#bar .ch{color:var(--mute);font-weight:700;font-size:calc(var(--fs)*.55);letter-spacing:2px}
#st{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:700;font-size:calc(var(--fs)*.5);color:var(--mute)}
#dot{width:14px;height:14px;border-radius:50%;background:var(--steel)}
#dot.on{background:#3ddc84}
#dot.err{background:var(--red2)}
#list{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 24px 14px;gap:6px}
.m{font-size:var(--fs);line-height:1.25;padding:6px 14px;border-left:5px solid transparent;border-radius:3px;background:rgba(20,20,27,.78);word-break:break-word;animation:in .25s ease-out}
.m .u{font-weight:700;margin-right:10px}
.m .b{display:inline-block;min-width:1.15em;padding:0 6px;margin-right:6px;border-radius:3px;font-size:.62em;font-weight:800;text-align:center;vertical-align:middle;color:#0a0a0e}
.b.br{background:var(--red2);color:#fff}.b.mo{background:#3ddc84}.b.vp{background:#ff7ad9}.b.sb{background:var(--gold)}
.m img.bg{height:1.25em;width:1.25em;vertical-align:middle;margin-right:6px;image-rendering:auto}
.m img.e{height:1.5em;vertical-align:middle;margin:0 2px}
.m.act .t{font-style:italic}
.m.hi{border-left-color:var(--gold);background:rgba(196,18,28,.28)}
.m.ev{border-left-color:var(--gold);background:linear-gradient(90deg,rgba(196,18,28,.5),rgba(20,20,27,.7));color:var(--gold);font-weight:700}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#empty{margin:auto;color:var(--mute);font-size:calc(var(--fs)*.7);text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="fx"></div>
  <div id="chat">
    <div id="bar">
      <h1>CHEETOS GANG</h1>
      <span class="ch" id="ch"></span>
      <div id="st"><span id="dot"></span><span id="stt">Connexion…</span></div>
    </div>
    <div id="list"><div id="empty">Le chat arrive…</div></div>
  </div>
</div>
<script>
(function(){
  // Réglages (dans l'adresse) : ?channel=nakeetos&size=34&hidecmd=1&max=40&hidebots=nightbot,streamelements&embers=0
  var q=new URLSearchParams(location.search);
  var CHANNEL=(q.get('channel')||'nakeetos').toLowerCase();
  var SIZE=parseInt(q.get('size')||'34',10);
  var MAX=parseInt(q.get('max')||'40',10);
  var HIDECMD=q.get('hidecmd')!=='0';
  var HIDE=(q.get('hidebots')||'nightbot,streamelements').toLowerCase().split(',').filter(Boolean);
  document.documentElement.style.setProperty('--fs',SIZE+'px');
  document.getElementById('ch').textContent='#'+CHANNEL;
  var list=document.getElementById('list'),dot=document.getElementById('dot'),stt=document.getElementById('stt');
  function status(c,t){dot.className=c;stt.textContent=t}

  // braises
  if(q.get('embers')!=='0'){
    var fx=document.getElementById('fx');
    for(var k=0;k<22;k++){
      var s=document.createElement('i');
      s.style.left=(Math.random()*100)+'%';
      s.style.animationDuration=(7+Math.random()*9)+'s';
      s.style.animationDelay=(-Math.random()*14)+'s';
      var sz=3+Math.random()*5;s.style.width=s.style.height=sz+'px';
      fx.appendChild(s);
    }
  }

  function esc(s){return s.replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function parseTags(s){var o={};s.split(';').forEach(function(p){var i=p.indexOf('=');o[p.slice(0,i)]=p.slice(i+1)});return o}
  function unesc(v){return (v||'').replace(/\\s/g,' ').replace(/\\:/g,';').replace(/\\\\/g,'\\')}
  function safeColor(c,name){
    if(/^#[0-9a-fA-F]{6}$/.test(c||'')){
      var r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
      if(0.299*r+0.587*g+0.114*b>70)return c;
    }
    var pal=['#ff6a5a','#ffd24a','#7fd8ff','#c9a6ff','#7dffb0','#ff9ad1'];
    var h=0;for(var i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;
    return pal[h%pal.length];
  }
  // mois d'abonnement -> badge 1..9 (basique, 2, 3, 6, 9, 12, 18, 24, 30 mois)
  var STEPS=[0,2,3,6,9,12,18,24,30];
  function subMonths(tags){
    var bi=tags['badge-info']||'',m=/subscriber\/(\d+)/.exec(bi)||/founder\/(\d+)/.exec(bi);
    if(m)return parseInt(m[1],10);
    var bd=/subscriber\/(\d+)/.exec(tags.badges||'');
    return bd?Math.min(parseInt(bd[1],10),3)>=0&&parseInt(bd[1],10)<100?parseInt(bd[1],10):1:1;
  }
  function subBadge(tags){
    var mo=subMonths(tags),n=1;
    for(var i=0;i<STEPS.length;i++){if(mo>=STEPS[i])n=i+1}
    return '<img class="bg" alt="SUB" src="badges/sub'+n+'.png" onerror="this.outerHTML=\'<span class=&quot;b sb&quot;>SUB</span>\'">';
  }
  function badgesHtml(tags){
    var out='',bs=tags.badges||'';
    bs.split(',').forEach(function(b){
      var k=b.split('/')[0];
      if(k==='broadcaster')out+='<span class="b br">★</span>';
      else if(k==='moderator')out+='<span class="b mo">MOD</span>';
      else if(k==='vip')out+='<span class="b vp">VIP</span>';
      else if(k==='subscriber'||k==='founder')out+=subBadge(tags);
    });
    return out;
  }
  function textHtml(text,emotes){
    var chars=Array.from(text),map={};
    if(emotes){
      emotes.split('/').forEach(function(e){
        var p=e.split(':');if(p.length<2)return;
        p[1].split(',').forEach(function(r){
          var a=r.split('-');map[parseInt(a[0],10)]={id:p[0],end:parseInt(a[1],10)};
        });
      });
    }
    var out='',i=0;
    while(i<chars.length){
      var m=map[i];
      if(m&&/^[\w-]+$/.test(m.id)){
        out+='<img class="e" alt="" src="https://static-cdn.jtvnw.net/emoticons/v2/'+m.id+'/default/dark/2.0">';
        i=m.end+1;
      }else{out+=esc(chars[i]);i++}
    }
    return out;
  }
  function push(el){
    var e=document.getElementById('empty');if(e)e.remove();
    list.appendChild(el);
    while(list.children.length>MAX)list.removeChild(list.firstChild);
  }
  function addMsg(tags,user,text){
    var act=false;
    var mm=/^\u0001ACTION (.*)\u0001$/.exec(text);
    if(mm){act=true;text=mm[1]}
    if(HIDECMD&&text.charAt(0)==='!')return;
    if(HIDE.indexOf(user.toLowerCase())>-1)return;
    var name=unesc(tags['display-name'])||user;
    var d=document.createElement('div');
    d.className='m'+(act?' act':'')+(tags['msg-id']==='highlighted-message'||tags['first-msg']==='1'||tags.bits?' hi':'');
    var cheer=tags.bits?'<span class="b sb">'+esc(String(parseInt(tags.bits,10)||0))+' BITS</span>':'';
    d.innerHTML=cheer+badgesHtml(tags)+'<span class="u" style="color:'+safeColor(tags.color,user)+'">'+esc(name)+'</span><span class="t">'+textHtml(text,tags.emotes)+'</span>';
    push(d);
  }
  function addEvent(tags){
    var id=tags['msg-id'];
    if(['sub','resub','subgift','submysterygift','raid','anonsubgift'].indexOf(id)<0)return;
    var sys=unesc(tags['system-msg']);if(!sys)return;
    var d=document.createElement('div');
    d.className='m ev';d.textContent=sys;push(d);
  }
  var ws,tries=0;
  function connect(){
    status('','Connexion…');
    ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    ws.onopen=function(){
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send('PASS SCHMOOPIIE');
      ws.send('NICK justinfan'+Math.floor(10000+Math.random()*80000));
      ws.send('JOIN #'+CHANNEL);
    };
    ws.onmessage=function(ev){
      String(ev.data).split('\r\n').forEach(function(line){
        if(!line)return;
        if(line.indexOf('PING')===0){ws.send('PONG :tmi.twitch.tv');return}
        var tags={},rest=line;
        if(line.charAt(0)==='@'){var sp=line.indexOf(' ');tags=parseTags(line.slice(1,sp));rest=line.slice(sp+1)}
        var m=/^:([^!]+)![^ ]+ PRIVMSG #[^ ]+ :(.*)$/.exec(rest);
        if(m){addMsg(tags,m[1],m[2]);return}
        if(/ USERNOTICE /.test(rest)){addEvent(tags);return}
        if(/ 366 /.test(rest)||/ JOIN /.test(rest)){tries=0;status('on','En direct')}
      });
    };
    ws.onerror=function(){status('err','Erreur')};
    ws.onclose=function(){
      status('err','Reconnexion…');
      tries++;setTimeout(connect,Math.min(15000,1000*tries));
    };
  }
  connect();
  window.__chatTest=addMsg;
})();
</script>
</body>
</html>
